        verified: false
    note: PICP 용 블록도 불투수 블록과 같은 C936 을 쓴다. 제조사 인증은 직전 12개월 내 시험 필요.

  - id: ASTM_C1701
    title: Standard Test Method for Infiltration Rate of In Place Pervious Concrete
    body: ASTM
    verified: false
    note: 단일 링 침투계. PICP·콘크리트 그리드·포러스 콘크리트 표면 침투율 측정에 쓰인다. 한국의 K-SWIFT 와 비교 대상.

  - id: ASTM_D3385
    title: Infiltration Rate of Soils in Field Using Double-Ring Infiltrometer
    body: ASTM
    verified: false
