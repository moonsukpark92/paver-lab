  - id: ASCE_68_18
    title: Permeable Interlocking Concrete Pavement (ASCE/T&DI/ICPI 68-18)
    body: ASCE / T&DI / ICPI
    source: https://ascelibrary.org/doi/book/10.1061/9780784415009
    verified: false
    scope: [용어, 구조설계(차량하중), 수문설계, 시공·검사, 표준시방, 유지관리]
    note: 실대형 재하시험을 보조기층 두께표로 번역해 놓은 것이 핵심. 국내 기준에 없는 부분.

  - id: ISO_22197_1
    title: Test method for air-purification performance of semiconducting photocatalytic materials — Part 1 Removal of nitric oxide
    body: ISO
    verified: false
    note: 공기정화 블록의 NOx 제거 성능은 이 시험으로 잰다. ASTM 에는 광촉매 포장 표준이 없다.

  - id: SPS_F_KSPIC_001_2006
    title: 보도용 포장재 단체표준(문헌 인용)
    verified: false
