# 표준 원장 — 콘크리트 보도블록 연구소
#
# 규칙: verified: true 는 "원문(표준 전문 또는 발행기관 PDF)을 직접 읽고 옮겨 적었다"는 뜻이다.
# 2차 인용(뉴스·요약·검색결과)에서 온 값은 전부 verified: false 다. 값이 맞아 보여도 마찬가지다.
# 글에 쓸 때 verified:false 값은 반드시 [미검증] 태그를 달고 출처를 밝힌다.
#
# 수집: 2026-09-19 (구축 모드 1회차)

version: 1
collected_at: 2026-09-19

standards:
  # ---------------------------------------------------------------- 국내
  - id: KS_F_4419
    title: 보차도용 콘크리트 인터로킹 블록
    body: 한국산업표준(KS)
    edition: "KS F 4419:2022"
    source: 사내 보관 원문 PDF (50_제품기술/시공_규격_제도/KSF4419_KR.pdf)
    access: 원문 확보. 2025-08-22 개정본(HWP)도 보유 — 차이 대조 예정.
    verified: true
    verified_at: 2026-09-20
    values:
      - key: 휨강도_투수성블록_보도용
        value: 4.0
        unit: MPa
        note: "표 1. MPa(=N/mm2)"
        verified: true
      - key: 휨강도_투수성블록_차도용
        value: 5.0
        unit: MPa
        note: 표 1. 2차 인용에는 빠져 있던 값이다
        verified: true
      - key: 휨강도_보통블록
        value: 5.0
        unit: MPa
        verified: true
      - key: 흡수율_보통블록_개개
        value: 10
        unit: "%"
        note: 이하. 평균은 7 % 이하. 투수성 블록은 흡수율 규정이 없다
        verified: true
      - key: 투수계수_투수성블록
        value: 0.1
        unit: mm/s
        note: 이상. 시료 3개를 1분 이상 간격으로 시험한 값의 평균(8.3.2 f)
        verified: true
      - key: 표면층_두께
        value: 6
        unit: mm
        note: |
          4.3. 표면에서 6 mm 이상, 휨강도 시험 후 표면층 분리 없을 것.
          서울시 안내 자료를 2차 인용해 '유색층 8 mm'로 적었던 것은 오류다(2026-09-20 정정).
        verified: true
      - key: 두께_보도용
        value: 60
        unit: mm
        note: 차도용 80 mm. 허용차 가로·세로 ±2 mm, 두께 ±3 mm (표 2)
        verified: true
      - key: 측면_돌기
        value: "2~3"
        unit: mm
        note: 4.1.3. 이내
        verified: true
    투수계수_계산식: "K = (d / h) × Q / (A × 30 s)   [K mm/s, Q mm3, d 두께 mm, h 수위차 mm, A 단면적 mm2]"
    검사항목:
      보통블록: [겉모양·치수, 휨강도, 흡수율, 표면층 두께]
      투수블록: [겉모양·치수, 휨강도, 투수계수, 표면층 두께]
    resolved_question: |
      표 1 의 투수계수 칸에는 '등급 | 기준' 두 열이 있으나 투수성 블록 행에는 기준(0.1 이상)만 적혀 있다.
      → 투수 지속성 '등급'은 KS 본문이 아니라 서울시 기준이 정하는 것이다. (2026-09-20 원문 확인)

  - id: SEOUL_투수블록포장기준
    title: 서울시 투수블록포장 설계·시공 및 유지관리 기준
    body: 서울특별시
    legal_base: 서울특별시 물순환 회복 및 저영향 개발 기본조례
    verified: false
    values:
      - key: 투수지속성_최저등급
        value: 3등급
        note: 원칙적으로 투수 지속성 3등급 이상만 사용. 등급 외 제품 사용 불가
        verified: false
      - key: 청소주기
        value: 연 2회 (3월, 6월)
        note: 진공 고압흡입청소 권장
        verified: false
      - key: 준공시_투수계수_권장
        value: 1.0
        unit: mm/s
        note: 기준(0.1)이 아니라, 경년 후에도 기준을 지키려면 준공 시 이 값 이상이어야 한다는 지적
        verified: false
    key_point: |
      지속성 검증시험은 시료를 협잡물로 오염시킨 뒤 투수계수를 잰다.
      즉 제도의 판단 기준이 "새 제품 성능"이 아니라 "더러워진 뒤 성능"이다.
      → 블로그 1번 아이템 후보.

  - id: MOLIT_투수블록포장기준개선연구
    title: 투수블록포장 기준 개선 연구
    body: 국토교통부 / 국토교통과학기술진흥원 (CODIL)
    source: https://www.codil.or.kr/filebank/original/RK/OTKCRK190199/OTKCRK190199.pdf
    verified: false
    fetch_status: 실패 — TLS 인증서 검증 오류(2026-09-19). 수동 내려받기 필요.

  - id: K_SWIFT
    title: 현장 투수성능 간이시험(K-SWIFT)
    body: 서울기술연구원 / 서울특별시
    verified: false
    method: 물 3 L 를 일정 높이에서 흘려보내고 젖은 범위를 측정
    criterion: 유지관리 후 최소 투수계수 0.1 mm/s 이상 확보
    note: 2025년 '투수블록 투수성능 유지관리 용역(집중관리지역)'에 적용

  # ---------------------------------------------------------------- 국외
  - id: ASTM_C936
    title: Standard Specification for Solid Concrete Interlocking Paving Units
    body: ASTM
    verified: false
    values:
      - key: 압축강도_최소
        value: 8000
        unit: psi
