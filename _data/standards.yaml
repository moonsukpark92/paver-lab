    a: "KS/서울시 준공 기준 0.1 mm/s"
    b: "경년 유지를 위해 준공 시 1.0 mm/s 필요하다는 현장·연구 지적"
    resolution: 미정 — 대표 판단 필요. 두 값을 모두 제시하는 글로 쓰는 것이 정직하다.
  - topic: 광촉매 블록 성능
    a: "실험실 NOx 제거율 73~77.5%"
    b: "실규모 현장(안트베르펜 1만 m2, 일본 5만 m2+) 도로변 NOx 저감 15~20%"
    resolution: 둘 다 사실이며 조건이 다르다. 실험실값을 현장값처럼 쓰지 않는다.
