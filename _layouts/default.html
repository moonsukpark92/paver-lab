<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {%- seo -%}
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="masthead">
    <div class="wrap masthead__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        콘크리트 보도블록 <em>연구소</em>
      </a>
      <nav class="nav" aria-label="주요">
        <a href="{{ '/standards/' | relative_url }}"{% if page.url == '/standards/' %} aria-current="page"{% endif %}>표준 원장</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>연구소</a>
        <a href="{{ '/en/' | relative_url }}" translate="no" lang="en"{% if page.url == '/en/' %} aria-current="page"{% endif %}>EN</a>
      </nav>
    </div>
  </header>

  <main id="main">{{ content }}</main>

  <footer class="foot">
    <div class="wrap">
      <p class="foot__rule">수치에는 출처나 조건이 붙습니다. 확인하지 못한 값은 <span class="badge badge--unverified">미검증</span>으로 남깁니다.</p>
      <p class="foot__meta">
        <span translate="no">{{ site.title }}</span> · 박문석 ·
        <a href="{{ site.github.repository_url | default: 'https://github.com/moonsukpark92/paver-lab' }}">저장소</a> ·
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
